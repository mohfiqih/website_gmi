name: Deploy Laravel ke Rumahweb

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rumahweb-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Abaikan entri submodule rusak saat cleanup checkout
        run: git update-index --force-remove public/template_home

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build asset Laravel Mix
        run: npm run prod

      - name: Periksa pengaturan FTP
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_HOST" || { echo "::error::Tambahkan secret FTP_SERVER atau FTP_HOST."; exit 1; }
          test -n "$FTP_USERNAME" || { echo "::error::Tambahkan secret FTP_USERNAME."; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "::error::Tambahkan secret FTP_PASSWORD."; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo "::error::Tambahkan secret FTP_SERVER_DIR."; exit 1; }

      - name: Rapikan path folder FTP
        id: ftp-dir
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          dir="$FTP_SERVER_DIR"
          while [[ "$dir" == */ ]]; do dir="${dir%/}"; done
          printf 'server_dir=%s/\n' "$dir" >> "$GITHUB_OUTPUT"

      - name: Upload aplikasi Laravel ke Rumahweb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ steps.ftp-dir.outputs.server_dir }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/storage/**
            db_gmi.sql
